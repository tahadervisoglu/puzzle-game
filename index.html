<!DOCTYPE html>

<title>Minigames — Tank Düellosu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="src/ui/stil.css">
</head>
<body>

<div id="ekranGiris" class="ekran">
  <h1>Minigames</h1>
  <p class="alt">8 parti oyunu · 5 kişiye kadar · tarayıcıda</p>
  <input id="girisAd" maxlength="12" placeholder="Adın" autocomplete="off">
  <button id="btnOyna" class="ana">Oyna</button>
  <p id="girisHata" class="hata"></p>
  <button id="btnBagTest" class="kucuk">Bağlantı testi</button>
  <pre id="bagTestSonuc" class="gizli"></pre>
</div>

<div id="ekranLobi" class="ekran gizli">
  <h2 id="lobiBaslik">Oyuncular</h2>
  <ul id="lobiListe"></ul>
  <div id="turSecici" class="gizli">
    <span class="etiket">Kaç tur?</span>
    <div class="sira" id="turDugmeleri"></div>
    <span class="etiket">Oyun</span>
    <div id="oyunDugmeleri"></div>
  </div>
  <button id="btnBotEkle" class="kucuk gizli">+ Bot ekle (test için)</button>
  <button id="btnBaslat" class="ana gizli">Başlat</button>
  <p id="lobiBilgi" class="alt"></p>
  <button id="btnAyril" class="kucuk">Ayrıl</button>
</div>

<div id="ekranOyun" class="ekran gizli">
  <div id="ustBar">
    <div id="ustBilgi"></div>
    <button id="btnLobiyeDon" class="kucuk gizli">Lobiye dön</button>
  </div>
  <canvas id="oyunCv"></canvas>
  <div id="perde" class="gizli"></div>
</div>
